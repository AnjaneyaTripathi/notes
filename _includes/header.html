<header class="site-header" role="banner">
  <div class="wrapper site-header__inner">
    <a class="site-brand" rel="author" href="{{ "/" | relative_url }}" aria-label="{{ site.title | escape }}, home">
      <span class="site-brand__mark" aria-hidden="true">AT</span>
      <span class="site-brand__copy">
        <span class="site-brand__name">{{ site.title | escape }}</span>
        <span class="site-brand__descriptor">reading notes &amp; ideas</span>
      </span>
    </a>

    <nav class="site-nav" aria-label="Primary navigation">
      <a href="{{ "/" | relative_url }}">Reading archive</a>
      {%- if site.github_username -%}
        <a href="https://github.com/{{ site.github_username | cgi_escape }}">GitHub</a>
      {%- endif -%}
    </nav>
  </div>
</header>
